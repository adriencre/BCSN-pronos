name: Automations Rappels Matchs BCSN

on:
  schedule:
    # S'exécute automatiquement toutes les heures
    - cron: "0 * * * *"
  workflow_dispatch: # Permet aussi de déclencher manuellement depuis l'onglet Actions de GitHub

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la vérification des rappels de matchs
        run: |
          curl -s -X GET "https://bcsn-pronos.netlify.app/api/cron/reminders" || echo "Erreur ou site en cours de déploiement"
